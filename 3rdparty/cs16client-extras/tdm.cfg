// CS16Client -- Team Deathmatch (CT vs Terrorists)
// Host a game with bots, then run from console:  exec tdm.cfg   (or type: tdm)
// Revert to normal play with:  exec dm_off.cfg   (or type: dmoff)

mp_freeforall          0     // team-based
mp_friendlyfire        0
mp_round_infinite      1     // round never ends -> continuous play
mp_forcerespawn        3     // auto-respawn 3 seconds after death
mp_respawn_immunitytime 2    // brief spawn protection
mp_timelimit           10    // match length in minutes -> changes map
mp_freezetime          0     // no freeze time
mp_roundtime           9     // (irrelevant with round_infinite, kept sane)

// Loadout: full money, buy anywhere, anytime
mp_startmoney          16000
mp_maxmoney            16000
mp_buytime             9999
mp_buy_anywhere        1

mp_autoteambalance     1
mp_limitteams          2

mp_restartround        1     // apply now and respawn everyone
echo "[CS16Client] Team deathmatch ON (10 min, respawn 3s). Type dmoff to revert."
