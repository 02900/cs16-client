// mp3boot.cfg -- boot straight into a Free-for-all bot game (for fast HUD testing).
// Launch with:  xash3d.exe -game cstrike +maxplayers 12 +exec mp3boot.cfg
// (the +maxplayers on the command line is the reliable way to give the listen
//  server slots for bots; the line below is a fallback for engines that honor it.)
// Without these flags the game starts normally at the main menu.

maxplayers 12          // slots for bots+you (else the listen server has no room -> no enemies)
mp_godmode 0           // testing aid: set 1 for invulnerability (ReGameDLL)
cam_thirdperson_enable 1  // start in the over-the-shoulder (Max Payne 3) camera
aim_assist_width 0.25     // soft-lock free-aim zone half-width (xbody); human silhouette = narrow
aim_assist_height 0.5     // soft-lock free-aim zone half-height (xbody); human silhouette = tall
aim_assist_cap 2.0        // outer hard-clamp ring as a multiple of the free-aim zone
aim_assist_range 2250     // auto-aim acquisition range (units)

exec dm.cfg            // Free-for-all rules + broadcast all-player health (over-head bars)

bot_quota_mode normal
bot_auto_vacate 0
bot_join_team any
bot_difficulty 2
bot_quota 7

map de_dust2           // has an overview, so the minimap shows
