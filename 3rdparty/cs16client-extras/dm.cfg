// CS16Client -- Free-for-all Deathmatch (everyone vs everyone)
// Host a game with bots, then run from console:  exec dm.cfg   (or type: dm)
// Revert to normal play with:  exec dm_off.cfg   (or type: dmoff)

mp_freeforall          1     // everyone is an enemy (auto-disables friendly fire)
mp_round_infinite      1     // round never ends -> continuous play
mp_forcerespawn        3     // auto-respawn 3 seconds after death
mp_respawn_immunitytime 2    // brief spawn protection
mp_timelimit           10    // match length in minutes -> changes map
mp_freezetime          0     // no freeze time
mp_roundtime           10    // = mp_timelimit; drives the on-screen countdown (starts at 10:00)
mp_scoreboard_showhealth 4   // broadcast every player's HP to all clients (over-head health bars)

// Loadout: full money, buy anywhere, anytime
mp_startmoney          16000
mp_maxmoney            16000
mp_buytime             9999
mp_buy_anywhere        1

mp_autoteambalance     0
mp_limitteams          0

mp_restartround        1     // apply now and respawn everyone
echo "[CS16Client] Free-for-all deathmatch ON (10 min, respawn 3s). Type dmoff to revert."
