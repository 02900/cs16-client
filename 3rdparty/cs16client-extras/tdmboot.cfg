// tdmboot.cfg -- boot straight into a Team Deathmatch bot game (for fast HUD testing).
// Launch with:  xash3d.exe -game cstrike +maxplayers 12 +exec tdmboot.cfg
// Without these flags the game starts normally at the main menu.

maxplayers 12          // slots for bots+you (else the listen server has no room -> no enemies)
mp_godmode 0           // testing aid: set 1 for invulnerability (ReGameDLL)
cam_thirdperson_enable 1  // start in the over-the-shoulder (Max Payne 3) camera
aim_assist_deadzone 0.5   // soft-lock free-aim cone (multiple of body size); testing 0.5 vs 1.0
aim_assist_range 2250     // auto-aim acquisition range (units)

exec tdm.cfg           // Team Deathmatch rules + broadcast all-player health (over-head bars)

bot_quota_mode normal
bot_auto_vacate 0
bot_join_team any      // bots fill both teams (team balance keeps them even)
bot_difficulty 2
bot_quota 7

map de_dust2           // has an overview, so the minimap shows
